<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Game shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

</head>

<body>
    <div class="hero-wrapper">
        <header class="navbar">
            <div class="logo"><img src="/assets/VideoGame_logo.png" alt="" srcset=""></div>
            <div class="nav-btn-group buttons">
                <div class="button">Home</div>
                <div class="button">Shop</div>
                <div class="button">Blog</div>
                <div class="button">Contact Us</div>
            </div>
            <div class="nav-btn-group icons">
                <div class="icon"><img src="/assets/icons/ant-design_search-outlined.svg" alt=""></div>
                <div class="icon"><img src="/assets/icons/ant-design_shopping-outlined.svg" alt=""></div>
                <div class="icon"><img src="/assets/icons/ant-design_user-outlined.svg" alt=""></div>

            </div>
        </header>
    </div>
            <div id="app" class="app-body">{{ message }}</div>

    <script src="/main.js" async defer></script>

    <script>
        const { createApp, ref } = Vue

        createApp({
            setup() {
                const message = ref('Hello vue!')
                return {
                    message
                }
            }
        }).mount('#app')
    </script>
</body>

</html>
